version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coaching_management
    ports:
      - '5432:5432'
    volumes:
      - cms_postgres_data:/var/lib/postgresql/data

volumes:
  cms_postgres_data:
